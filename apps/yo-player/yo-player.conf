# yo-player - homebrew package config for make_package_npdrm
#
# Content_ID format: XXNNNN-TTTTNNNNN_NN-MMMMMMMMMMMMMMMM (M = exactly 16 chars)
Content_ID = HB0001-YOPLAYER1_00-YOPLAYERHB000001

# Fake k_licensee. CFW (EVILNAT 4.93) doesn't validate this.
K_licensee = 0x00000000000000000000000000000000

# Free  -> no charge / no real DRM
# Local -> paid distribution
DRMType = Free

# GameExec -> bootable executable. XMB column is decided by PARAM.SFO CATEGORY
# (AT = Video), not by this field.
ContentType = GameExec

PackageVersion = 01.00
